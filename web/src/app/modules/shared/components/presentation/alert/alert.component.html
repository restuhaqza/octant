<ng-container *ngIf="showAlert">
  <clr-alert
    [clrAlertType]="status"
    [clrAlertClosable]="closable"
    [clrAlertLightweight]="type === 'light'"
    [clrAlertAppLevel]="type === 'banner'"
    (clrAlertClosedChange)="close()"
  >
    <clr-alert-item>
      <span class="alert-text">{{ message }}</span>
    </clr-alert-item>
  </clr-alert>
  <app-button-group [view]="buttonGroup" *ngIf="buttonGroup"></app-button-group>
</ng-container>
