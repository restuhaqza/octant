<button
  type="button"
  class="btn"
  [ngClass]="buttonClasses"
  [disabled]="disabled"
  (click)="onClick(v?.config?.payload, v?.config?.confirmation, v?.config?.modal)"
>
  {{ v?.config?.name }}
</button>

<app-view-modal *ngIf="modalView" [view]="modalView"></app-view-modal>
<clr-modal
  [(clrModalOpen)]="isConfirmationModalOpen"
  [clrModalClosable]="true"
  id="confirmation-modal"
>
  <h3 class="modal-title" cds-text="title" clrFocusOnViewInit tabindex="-1">{{ modalTitle }}</h3>
  <div class="modal-body">
    <div [innerHTML]="modalBody" ngPreserveWhitespaces></div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="toggleModal()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="acceptModal()">OK</button>
  </div>
</clr-modal>
