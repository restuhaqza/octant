<ng-container *ngIf="!isMarkdown; else markdown">
  <ng-container *ngIf="hasStatus">
    <app-indicator [status]="view.config.status"></app-indicator>
  </ng-container>
  {{ value }}
  <div *ngIf="clipboardValue" class="button-container">
    <div cds-layout="horizontal gap:sm">
      <button
        type="button"
        class="btn btn-link btn-icon copy-button"
        aria-label="copy-button"
        (click)="copyToClipboard()"
      >
        <clr-icon shape="clipboard"></clr-icon>
        <ng-container *ngIf="copied">Copied</ng-container>
      </button>
    </div>
  </div>
</ng-container>

<ng-template #markdown>
  <div ngPreserveWhitespaces [innerHTML]="value" class="markdown"></div>
</ng-template>
