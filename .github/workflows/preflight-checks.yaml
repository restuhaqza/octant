name: preflight-checks
on:
  push:
    tags:
    - 'v*'
    branches:
    - master
    - release-*
  pull_request:
    branches:
    - master
    - release-*

jobs:
  go_unit_tests:
    strategy:
      matrix:
        go-version:
          - 1.24.x
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    name: Golang tests on ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go-version }}
      - name: install_prettier
        run: |
          npm i -g prettier
      - name: run_go_tests
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go test

  verify_tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v2
        with:
          go-version: 1.24.x
      - uses: actions/checkout@v2
      - name: Get tag
        run: echo "GITHUB_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
      - name: Verify tag
        run: |
          bash ./ci/github-actions-tag-check.sh
        shell: bash

  node_unit_tests:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    name: Karma tests on ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - uses: actions/setup-go@v2
        with:
          go-version: 1.24.x
      - name: run_karma
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go web-test

  bundle_assets:
    needs: [go_unit_tests, node_unit_tests]
    strategy:
      matrix:
        go-version:
          - 1.24.x
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    name: Build on ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build web assets
        run: |
          go run build.go web-build
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-latest'
        with:
          name: bundle
          path: web/dist
      - name: Go tools
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go go-install
          go generate ./web
          go generate ./pkg/plugin/plugin.go
      - name: Build binary
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go build
          ./build/octant version
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Build electron binary
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go build-electron
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Build electron
        uses: samuelmeuli/action-electron-builder@v1.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_root: 'web'
          build_script_name: 'build-electron'
          # The binaries are attached to the release by the `release` job below
          # (via the uploaded artifacts). Without this, electron-builder's
          # default onTagOrDraft policy tries to publish and fails with 403.
          args: --publish never
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: electron-artifacts-${{ matrix.platform }}
          path: web/release/Octant*

  goreleaser:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle_assets, verify_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v2
        with:
          go-version: 1.24.x
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: web/dist
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # The config predates the GoReleaser v2 rewrite (it still uses
          # `replacements`), so stay on the last v1 that accepts it. Running on
          # the runner instead of the old goreleaser container is required: that
          # image shipped Go 1.20, which cannot parse go.mod's `go 1.24.0`, and
          # its musl is too old for the Node runtime GitHub injects.
          version: v1.18.2
          args: release --skip-publish --clean
        env:
          GOFLAGS: -mod=vendor
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-artifacts
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [goreleaser, bundle_assets]
    runs-on: ubuntu-latest
    # Required to create the GitHub release; the default token is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
      - uses: actions/download-artifact@v4
        with:
          name: binary-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-artifacts-*
          merge-multiple: true
          path: web/release
      - name: Create release
        run: |
          set -x
          tag="${GITHUB_REF_NAME}"
          assets=()
          for asset in ./dist/*; do
            case "$asset" in
              *.txt|*.tar.gz|*.rpm|*.deb|*.zip) assets+=("$asset") ;;
            esac
          done
          for asset in ./web/release/Octant*; do
            shasum -a 256 "$asset" | awk '{sub(/.*\//," ",$2)} 1' >> ./dist/checksums.txt
            assets+=("$asset")
          done
          # `hub` is no longer installed on the ubuntu runners; use the GitHub CLI.
          gh release create "$tag" --draft --title "$tag" "${assets[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
