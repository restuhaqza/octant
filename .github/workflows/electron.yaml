name: electron

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - uses: actions/setup-go@v2
        with:
          go-version: 1.24.x
      # Builds the Go sidecar, the renderer, and the platform installers.
      # On macOS this emits both Octant-<version>-arm64.dmg and
      # Octant-<version>-universal.dmg. Nothing is published from this workflow.
      - name: Build desktop installers
        env:
          GOFLAGS: -mod=vendor
        run: |
          go run build.go dist-electron
